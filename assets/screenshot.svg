<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2645" />
      <stop offset="100%" stop-color="#191529" />
    </linearGradient>
    <linearGradient id="roomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9d6" />
      <stop offset="100%" stop-color="#ffdcc2" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="100%" stop-color="#ff8e53" />
    </linearGradient>
    <radialGradient id="furGrad" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffad4e" />
      <stop offset="60%" stop-color="#ee8228" />
      <stop offset="100%" stop-color="#be5715" />
    </radialGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1df" />
      <stop offset="75%" stop-color="#efd5b8" />
      <stop offset="100%" stop-color="#c9aa8b" />
    </linearGradient>
  </defs>

  <rect width="820" height="520" rx="24" fill="url(#bgGrad)" />

  <!-- Left Feature Callouts -->
  <g transform="translate(48, 72)">
    <rect x="0" y="0" width="128" height="28" rx="14" fill="rgba(255,159,67,0.22)" stroke="#ff9f43" stroke-width="1.2" />
    <text x="64" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#ffd166" text-anchor="middle">ANDROID PUZZLE</text>

    <text x="0" y="72" font-family="Segoe UI, sans-serif" font-size="40" font-weight="900" fill="#ffffff">Mochi Pop!</text>
    <text x="0" y="102" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#d9cef0">Soft-3D Pet &amp; Gummy Block Puzzle</text>

    <g transform="translate(0, 140)" font-family="Segoe UI, sans-serif" font-size="14" fill="#ebe5f8">
      <text x="0" y="0" font-weight="700" fill="#ffd166">● Expressive 2.5D Clay Cat (Mochi)</text>
      <text x="16" y="22" font-size="12.5" fill="#c7bce0">Tracks your moves, cries on loss &amp; sulks when hungry!</text>

      <text x="0" y="60" font-weight="700" fill="#72dfd5">● 8x8 Gummy Combo &amp; Fish Board</text>
      <text x="16" y="82" font-size="12.5" fill="#c7bce0">Clear lines with golden fish to feed &amp; unlock coat skins.</text>

      <text x="0" y="120" font-weight="700" fill="#ff9ebb">● Sound, Visual FX &amp; Error Reports</text>
      <text x="16" y="142" font-size="12.5" fill="#c7bce0">Customizable comfort + 1-tap support to contact@jemangr.app.</text>
    </g>

    <g transform="translate(0, 326)">
      <rect x="0" y="0" width="235" height="44" rx="14" fill="url(#btnGrad)" />
      <text x="117" y="27" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Play, Feed &amp; Don't Make Him Cry!</text>
    </g>
  </g>

