      <rect x="54" y="80" width="22" height="22" rx="6" fill="#ffd166" />
      <rect x="28" y="106" width="22" height="22" rx="6" fill="#ffd166" />
      <rect x="54" y="106" width="22" height="22" rx="6" fill="#ffd166" />

      <rect x="132" y="106" width="22" height="22" rx="6" fill="#5f85ff" />
      <rect x="158" y="106" width="22" height="22" rx="6" fill="#5f85ff" />
      <rect x="184" y="106" width="22" height="22" rx="6" fill="#5f85ff" />

      <rect x="2" y="158" width="22" height="22" rx="6" fill="#ff9f43" />
      <rect x="28" y="158" width="22" height="22" rx="6" fill="#ff9f43" />
      <rect x="54" y="158" width="22" height="22" rx="6" fill="#b07aff" />
      <rect x="80" y="158" width="22" height="22" rx="6" fill="#b07aff" />
      <rect x="106" y="158" width="22" height="22" rx="6" fill="#b07aff" />
