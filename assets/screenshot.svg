<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2645" />
      <stop offset="100%" stop-color="#191529" />
    </linearGradient>
    <linearGradient id="roomGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9d6" />
      <stop offset="100%" stop-color="#ffdcc2" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="100%" stop-color="#ff8e53" />
    </linearGradient>
  </defs>

  <!-- Showcase Background -->
  <rect width="820" height="520" rx="24" fill="url(#bgGrad)" />

  <!-- Left Feature Callouts -->
  <g transform="translate(48, 72)">
    <rect x="0" y="0" width="128" height="28" rx="14" fill="rgba(255,107,139,0.22)" stroke="#ff6b8b" stroke-width="1.2" />
    <text x="64" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#ff9ebb" text-anchor="middle">ANDROID PUZZLE</text>

    <text x="0" y="72" font-family="Segoe UI, sans-serif" font-size="40" font-weight="900" fill="#ffffff">Mochi Pop!</text>
    <text x="0" y="102" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#d9cef0">Cozy Virtual Pet &amp; 8x8 Block Puzzle</text>

    <g transform="translate(0, 140)" font-family="Segoe UI, sans-serif" font-size="14" fill="#ebe5f8">
      <text x="0" y="0" font-weight="700" fill="#ffd166">● Live Emotional Cat (Mochi)</text>
      <text x="16" y="22" font-size="12.5" fill="#c7bce0">Tracks your moves, cries on loss &amp; sulks when hungry!</text>

      <text x="0" y="60" font-weight="700" fill="#72dfd5">● 8x8 Combo &amp; Golden Fish Board</text>
      <text x="16" y="82" font-size="12.5" fill="#c7bce0">Clear lines with fish treats to feed &amp; dress up Mochi.</text>

      <text x="0" y="120" font-weight="700" fill="#ff9ebb">● Sound, Visual FX &amp; Haptics Settings</text>
      <text x="16" y="142" font-size="12.5" fill="#c7bce0">Customizable comfort + 1-tap bug report support.</text>
    </g>

    <g transform="translate(0, 326)">
      <rect x="0" y="0" width="235" height="44" rx="14" fill="url(#btnGrad)" />
      <text x="117" y="27" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Play, Feed &amp; Don't Make Him Cry!</text>
    </g>
  </g>

  <!-- Right Phone Mockup (Happy Gameplay) -->
  <g transform="translate(470, 26)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="256" height="468" rx="26" fill="#fff8f0" stroke="#42365c" stroke-width="6" />

    <!-- Top HUD -->
    <rect x="3" y="3" width="250" height="40" rx="20" fill="#ffe9d6" />
    <rect x="12" y="9" width="54" height="26" rx="8" fill="#ffffff" />
    <text x="18" y="19" font-family="Segoe UI, sans-serif" font-size="7" font-weight="800" fill="#7b6d8d">SCORE</text>
    <text x="18" y="31" font-family="Segoe UI, sans-serif" font-size="12" font-weight="900" fill="#2f263b">1,240</text>

    <rect x="71" y="9" width="50" height="26" rx="8" fill="#ffffff" />
    <text x="77" y="19" font-family="Segoe UI, sans-serif" font-size="7" font-weight="800" fill="#7b6d8d">BEST</text>
    <text x="77" y="31" font-family="Segoe UI, sans-serif" font-size="12" font-weight="900" fill="#2f263b">3,890</text>

    <rect x="134" y="10" width="58" height="24" rx="12" fill="#ffffff" stroke="#ffb347" stroke-width="2" />
    <text x="163" y="26" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#c96a00" text-anchor="middle">🐟 6</text>

    <rect x="197" y="10" width="23" height="24" rx="8" fill="#ffffff" />
    <text x="208" y="26" font-size="12" text-anchor="middle">🎩</text>
    <rect x="224" y="10" width="23" height="24" rx="8" fill="#ffffff" />
    <text x="235" y="26" font-size="12" text-anchor="middle">⚙️</text>

    <!-- Pet Stage -->
    <rect x="3" y="42" width="250" height="122" fill="url(#roomGrad)" />
    <rect x="3" y="138" width="250" height="26" fill="#f4c7a1" />
    <line x1="3" y1="164" x2="253" y2="164" stroke="#e6b28a" stroke-width="2.5" />

    <!-- Window -->
    <rect x="192" y="50" width="48" height="40" rx="8" fill="#cceeff" stroke="#ffffff" stroke-width="3" />
    <line x1="216" y1="50" x2="216" y2="90" stroke="#ffffff" stroke-width="2.5" />

    <!-- Rug -->
    <ellipse cx="128" cy="152" rx="64" ry="12" fill="#ffabc0" stroke="#fff0f4" stroke-width="2" />

    <!-- Bars -->
    <rect x="12" y="50" width="76" height="14" rx="7" fill="rgba(255,255,255,0.8)" />
    <rect x="24" y="54" width="56" height="6" rx="3" fill="#ff9f43" />
    <rect x="12" y="68" width="76" height="14" rx="7" fill="rgba(255,255,255,0.8)" />
    <rect x="24" y="72" width="60" height="6" rx="3" fill="#ff6b8b" />

    <!-- Speech Bubble -->
    <rect x="148" y="52" width="66" height="22" rx="10" fill="#ffffff" />
    <text x="181" y="67" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#2f263b" text-anchor="middle">Yay! +2 🐟</text>

    <!-- Mochi Cat -->
    <g transform="translate(128, 126)">
      <!-- Tail -->
      <path d="M 28 12 Q 48 6 44 -14" fill="none" stroke="#523e4e" stroke-width="11" stroke-linecap="round" />
      <path d="M 28 12 Q 48 6 44 -14" fill="none" stroke="#fffbf5" stroke-width="7" stroke-linecap="round" />
      <!-- Ears -->
      <path d="M -32 -28 Q -24 -52 -10 -32 Z" fill="#fffbf5" stroke="#523e4e" stroke-width="2.4" />
      <path d="M -27 -30 Q -23 -43 -15 -31 Z" fill="#ff9ebb" />
      <path d="M 10 -32 Q 24 -52 32 -28 Z" fill="#fffbf5" stroke="#523e4e" stroke-width="2.4" />
      <path d="M 15 -31 Q 23 -43 27 -30 Z" fill="#ff9ebb" />
      <!-- Chubby Body -->
      <path d="M 0 -38 C 36 -38 40 -6 38 10 C 36 26 18 26 0 26 C -18 26 -36 26 -38 10 C -40 -6 -36 -38 0 -38 Z" fill="#fffbf5" stroke="#523e4e" stroke-width="2.5" />
      <ellipse cx="-12" cy="-28" rx="10" ry="6" transform="rotate(-18 -12 -28)" fill="#ffd8b8" />
      <ellipse cx="0" cy="11" rx="18" ry="11" fill="#fff1e6" />
      <!-- Cheeks -->
      <ellipse cx="-20" cy="-3" rx="6" ry="3.5" fill="rgba(255,138,165,0.65)" />
      <ellipse cx="20" cy="-3" rx="6" ry="3.5" fill="rgba(255,138,165,0.65)" />
      <!-- Glossy Eyes -->
      <circle cx="-14" cy="-11" r="5" fill="#2d2130" />
      <circle cx="-15.5" cy="-12.5" r="1.8" fill="#ffffff" />
      <circle cx="14" cy="-11" r="5" fill="#2d2130" />
      <circle cx="12.5" cy="-12.5" r="1.8" fill="#ffffff" />
      <!-- Nose & :3 Mouth -->
      <ellipse cx="0" cy="-6" rx="2.5" ry="1.8" fill="#ff85a1" />
      <path d="M -6 -2 Q -3 2 0 -2 Q 3 2 6 -2" fill="none" stroke="#523e4e" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 8x8 Board -->
    <rect x="18" y="174" width="220" height="220" rx="14" fill="#3b3048" />
    <!-- Grid Pattern -->
    <g transform="translate(24, 180)">
      <!-- Background 8x8 dark cells (26px step, 23px cell) -->
      <rect x="0" y="0" width="208" height="208" rx="8" fill="#4d3f5e" opacity="0.5" />
      <!-- Colorful placed blocks -->
      <rect x="2" y="2" width="22" height="22" rx="5" fill="#ff6b8b" />
      <rect x="28" y="2" width="22" height="22" rx="5" fill="#ff6b8b" />
      <rect x="54" y="2" width="22" height="22" rx="5" fill="#ff6b8b" />

      <rect x="106" y="28" width="22" height="22" rx="5" fill="#2ec4b6" />
      <rect x="132" y="28" width="22" height="22" rx="5" fill="#2ec4b6" />
      <rect x="106" y="54" width="22" height="22" rx="5" fill="#2ec4b6" />
      <text x="143" y="44" font-size="12" text-anchor="middle">🐟</text>

      <rect x="28" y="80" width="22" height="22" rx="5" fill="#ffd166" />
      <rect x="54" y="80" width="22" height="22" rx="5" fill="#ffd166" />
      <rect x="28" y="106" width="22" height="22" rx="5" fill="#ffd166" />
      <rect x="54" y="106" width="22" height="22" rx="5" fill="#ffd166" />

      <rect x="132" y="106" width="22" height="22" rx="5" fill="#5f85ff" />
      <rect x="158" y="106" width="22" height="22" rx="5" fill="#5f85ff" />
      <rect x="184" y="106" width="22" height="22" rx="5" fill="#5f85ff" />

      <rect x="2" y="158" width="22" height="22" rx="5" fill="#ff9f43" />
      <rect x="28" y="158" width="22" height="22" rx="5" fill="#ff9f43" />
      <rect x="54" y="158" width="22" height="22" rx="5" fill="#b07aff" />
      <rect x="80" y="158" width="22" height="22" rx="5" fill="#b07aff" />
      <rect x="106" y="158" width="22" height="22" rx="5" fill="#b07aff" />
    </g>

    <!-- Bottom Tray -->
    <rect x="18" y="402" width="54" height="50" rx="10" fill="#f2e8df" stroke="#e4d5c7" stroke-width="1.5" />
    <rect x="30" y="416" width="14" height="14" rx="3" fill="#2ec4b6" />
    <rect x="46" y="416" width="14" height="14" rx="3" fill="#2ec4b6" />

    <rect x="78" y="402" width="54" height="50" rx="10" fill="#f2e8df" stroke="#e4d5c7" stroke-width="1.5" />
    <rect x="92" y="412" width="13" height="13" rx="3" fill="#ff9f43" />
    <rect x="92" y="427" width="13" height="13" rx="3" fill="#ff9f43" />
    <rect x="107" y="427" width="13" height="13" rx="3" fill="#ff9f43" />

    <rect x="138" y="402" width="54" height="50" rx="10" fill="#f2e8df" stroke="#e4d5c7" stroke-width="1.5" />
    <rect x="150" y="420" width="10" height="10" rx="2" fill="#b07aff" />
    <rect x="162" y="420" width="10" height="10" rx="2" fill="#b07aff" />
    <rect x="174" y="420" width="10" height="10" rx="2" fill="#b07aff" />

    <rect x="198" y="402" width="40" height="50" rx="10" fill="#2ec4b6" />
    <text x="218" y="428" font-size="16" text-anchor="middle">🔄</text>
    <text x="218" y="444" font-family="Segoe UI, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">AD</text>
  </g>
</svg>
