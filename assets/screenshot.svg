    <rect x="92" y="412" width="13" height="13" rx="4" fill="#ff9f43" />
    <rect x="92" y="427" width="13" height="13" rx="4" fill="#ff9f43" />
    <rect x="107" y="427" width="13" height="13" rx="4" fill="#ff9f43" />

    <rect x="138" y="402" width="54" height="50" rx="10" fill="#f2e8df" stroke="#e4d5c7" stroke-width="1.5" />
    <rect x="150" y="420" width="10" height="10" rx="3" fill="#b07aff" />
    <rect x="162" y="420" width="10" height="10" rx="3" fill="#b07aff" />
    <rect x="174" y="420" width="10" height="10" rx="3" fill="#b07aff" />

    <rect x="198" y="402" width="40" height="50" rx="10" fill="#2ec4b6" />
